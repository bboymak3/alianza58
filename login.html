<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="AO8x2D5digAhJVNmj0wVdeJx60EpOc56vELa9rh_CmY" />
  <title>Iniciar Sesión | Alianza 58 Admin</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #fff; border-radius: 16px; padding: 40px; max-width: 400px; width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-logo { text-align: center; margin-bottom: 30px; }
    .login-logo h1 { font-size: 1.8rem; color: #1a1a1a; font-weight: 800; }
    .login-logo span { color: #C0392B; }
    .login-logo p { color: #666; font-size: 0.9rem; margin-top: 6px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 0.85rem; color: #333; margin-bottom: 6px; font-weight: 600; }
    .form-group input {
      width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0; border-radius: 10px;
      font-size: 1rem; transition: border-color 0.2s; outline: none;
    }
    .form-group input:focus { border-color: #C0392B; }
    .btn-login {
      width: 100%; padding: 14px; background: #C0392B; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #a93226; }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; }
    .alert {
      padding: 12px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 0.9rem; display: none;
    }
    .alert-error { background: #fee; color: #c0392b; border: 1px solid #f5b7b1; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .back-link { text-align: center; margin-top: 20px; }
    .back-link a { color: #666; text-decoration: none; font-size: 0.85rem; }
    .back-link a:hover { color: #C0392B; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <h1>Alianza <span>58</span></h1>
      <p>Panel de Administración</p>
    </div>

    <div class="alert alert-error" id="alertError"></div>
    <div class="alert alert-success" id="alertSuccess"></div>

    <form id="loginForm" onsubmit="return doLogin(event)">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required placeholder="admin@alianza58.com" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Iniciar Sesión</button>
    </form>

    <div class="back-link">
      <a href="/">← Volver al sitio</a>
    </div>
  </div>

  <script>
    // Si ya hay token válido, redirigir al admin
    (function() {
      const token = localStorage.getItem('a58_token');
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp && payload.exp > Math.floor(Date.now() / 1000) && payload.role === 'admin') {
            window.location.href = 'admin.html';
            return;
          }
        } catch(e) {}
        // Token inválido o expirado, limpiar
        localStorage.removeItem('a58_token');
        localStorage.removeItem('a58_user');
      }
    })();

    async function doLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btnLogin');
      const alertErr = document.getElementById('alertError');
      const alertSuccess = document.getElementById('alertSuccess');

      alertErr.style.display = 'none';
      alertSuccess.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Verificando...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await resp.json();

        if (!resp.ok) {
          throw new Error(data.error || 'Error al iniciar sesión');
        }

        // Guardar token y usuario
        localStorage.setItem('a58_token', data.token);
        localStorage.setItem('a58_user', JSON.stringify(data.user));

        alertSuccess.textContent = '¡Bienvenido ' + (data.user.name || 'Admin') + '! Redirigiendo...';
        alertSuccess.style.display = 'block';

        setTimeout(function() {
          window.location.href = 'admin.html';
        }, 800);

      } catch (err) {
        alertErr.textContent = err.message || 'Error de conexión';
        alertErr.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }

      return false;
    }
  </script>
</body>
</html>
